name: Atualizar Dados PECLD

on:
  schedule:
    # Roda todos os dias às 22:00 horário de Brasília (UTC-3 = 01:00 UTC do dia seguinte)
    - cron: '0 1 * * *'
  # Permite disparo manual pelo botão "Run workflow" na aba Actions do GitHub
  workflow_dispatch:
    inputs:
      desde:
        description: 'Data início (YYYY-MM-DD). Vazio = automático'
        required: false
        default: ''
      ate:
        description: 'Data fim   (YYYY-MM-DD). Vazio = hoje'
        required: false
        default: ''

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # permite commit/push no repositório

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      # ── 3. Chrome (necessário para o Selenium) ───────────────────────────────
      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1

      # ── 4. Diretórios ────────────────────────────────────────────────────────
      - name: Criar diretórios TEMP e data
        run: mkdir -p TEMP data

      # ── 5. Determinar período de download ────────────────────────────────────
      - name: Calcular período de download
        id: periodo
        run: |
          python - <<'PYEOF'
          import os, sys
          from datetime import date, timedelta

          # Entrada manual via workflow_dispatch
          desde_input = "${{ github.event.inputs.desde }}".strip()
          ate_input   = "${{ github.event.inputs.ate }}".strip()

          hoje = date.today()

          if desde_input:
              inicio = desde_input
          elif os.path.exists("data/dados_pecld.xlsx"):
              # Atualização incremental: baixa os últimos 7 dias para capturar correções
              inicio = (hoje - timedelta(days=7)).isoformat()
          else:
              # Primeiro download: ano inteiro
              inicio = date(hoje.year, 1, 1).isoformat()

          fim = ate_input if ate_input else hoje.isoformat()

          print(f"Período: {inicio} → {fim}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"inicio={inicio}\n")
              f.write(f"fim={fim}\n")
          PYEOF

      # ── 6. Download das notas do portal GPM ──────────────────────────────────
      - name: Download notas do GPM
        env:
          GPM_USER:     ${{ secrets.GPM_USER }}
          GPM_PASSWORD: ${{ secrets.GPM_PASSWORD }}
          GITHUB_ACTIONS: "true"
        run: |
          python main.py \
            --desde ${{ steps.periodo.outputs.inicio }} \
            --ate   ${{ steps.periodo.outputs.fim }}

      # ── 7. Processar CSVs e salvar XLSX acumulado ────────────────────────────
      - name: Processar e salvar dados (data/dados_pecld.xlsx)
        run: |
          python - <<'PYEOF'
          from sheets_uploader import enviar_para_github
          from datetime import date
          inicio = date.fromisoformat("${{ steps.periodo.outputs.inicio }}")
          fim    = date.fromisoformat("${{ steps.periodo.outputs.fim }}")
          enviar_para_github(data_inicio=inicio, data_fim=fim)
          PYEOF

      # ── 8. Gerar JSON estático para GitHub Pages ─────────────────────────────
      - name: Gerar arquivos JSON estáticos
        run: python generate_static.py

      # ── 9. Commit e push dos dados atualizados ───────────────────────────────
      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Atualizar dados PECLD $(date +%Y-%m-%d)"
          git push
