name: Atualizar Dados PECLD

on:
  schedule:
    # Roda todos os dias às 22:00 horário de Brasília (UTC-3 = 01:00 UTC do dia seguinte)
    - cron: '0 1 * * *'
  # Permite disparo manual pelo botão do site ou pela aba Actions do GitHub
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # ── 3. Baixar XLSX da pasta do Google Drive ──────────────────────────────
      - name: Baixar arquivos do Google Drive
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          mkdir -p data
          python download_from_drive.py

      # ── 4. Gerar JSON estático para o GitHub Pages ───────────────────────────
      - name: Gerar arquivos JSON estáticos
        run: python generate_static.py

      # ── 5. Commit e push ─────────────────────────────────────────────────────
      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Atualizar dados PECLD $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
